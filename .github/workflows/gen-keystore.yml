name: Generate Keystore (один раз)

# =============================================================================
#  Генерация собственного ключа подписи для KamiGram.
#  Запускать ОДИН раз (Actions → Generate Keystore → Run workflow).
#  Создаёт mod/keys/kamigram.jks + base64-копию и коммитит их в репозиторий,
#  после чего сборки APK подписываются этим ключом автоматически.
#
#  Приватный ключ хранится в публичном репозитории — это осознанный выбор:
#  так сборки воспроизводимы и подпись стабильна между релизами. Пароль не
#  является секретом, потому что сам ключ лежит в открытом виде (ровно так же
#  публичен upstream-ключ Telegram: android / androidkey / android).
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Алиас ключа"
        default: "kamigram"
        type: string
      password:
        description: "Пароль хранилища и ключа"
        default: "kamigram2026"
        type: string
      validity_days:
        description: "Срок действия (дней)"
        default: "10950"
        type: string
      force:
        description: "Перегенерировать, даже если ключ уже есть"
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALIAS: ${{ inputs.alias || 'kamigram' }}
      PASSWORD: ${{ inputs.password || 'kamigram2026' }}
      VALIDITY: ${{ inputs.validity_days || '10950' }}
      FORCE: ${{ inputs.force || false }}

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Сгенерировать keystore
        run: |
          set -euo pipefail
          mkdir -p mod/keys
          if [ -f mod/keys/kamigram.jks ] && [ "$FORCE" != "true" ]; then
            echo "::notice title=Keystore::ключ уже есть, генерация пропущена (можно перегенерировать с force=true)"
          else
            rm -f mod/keys/kamigram.jks mod/keys/kamigram.jks.b64
            keytool -genkeypair -v \
              -keystore mod/keys/kamigram.jks \
              -storetype JKS \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 4096 \
              -validity "$VALIDITY" \
              -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -dname "CN=KamiGram, OU=Mod, O=KamiGram, L=Telegram Mod, ST=NRW, C=DE"
            base64 -w0 mod/keys/kamigram.jks > mod/keys/kamigram.jks.b64
          fi

          echo "=== содержимое хранилища ==="
          keytool -list -v -keystore mod/keys/kamigram.jks -storepass "$PASSWORD" \
            | grep -E "Alias name|Valid from|Public Key|Signature algorithm|SHA256|SHA-256" | head -12

          FP=$(keytool -list -v -keystore mod/keys/kamigram.jks -storepass "$PASSWORD" \
                 | grep -m1 "SHA256:" | sed 's/.*SHA256: //')
          echo "FINGERPRINT=$FP" >> "$GITHUB_ENV"
          echo "::notice title=KamiGram signing key::SHA-256 отпечаток сертификата: $FP | alias=$ALIAS"

          ls -la mod/keys/

      - name: Закоммитить ключ в репозиторий
        run: |
          set -euo pipefail
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -f mod/keys/kamigram.jks mod/keys/kamigram.jks.b64
          if git diff --cached --quiet; then
            echo "::notice title=Keystore::нечего коммитить — файл уже в репозитории"
          else
            # [skip ci] — чтобы коммит ключа не запускал сборку APK сам по себе
            git commit -m "chore(keys): собственный ключ подписи KamiGram (alias=$ALIAS) [skip ci]"
            git push
          fi

      - name: Итог
        run: |
          {
            echo "## Ключ подписи KamiGram"
            echo
            echo "| параметр | значение |"
            echo "|---|---|"
            echo "| файл | \`mod/keys/kamigram.jks\` (и \`.b64\` для CI) |"
            echo "| alias | \`$ALIAS\` |"
            echo "| пароль | \`$PASSWORD\` |"
            echo "| срок | $VALIDITY дней |"
            echo "| SHA-256 сертификата | \`$FINGERPRINT\` |"
            echo
            echo "Следующая сборка APK подпишется этим ключом автоматически."
          } >> "$GITHUB_STEP_SUMMARY"
