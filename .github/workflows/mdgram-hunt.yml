name: "MDGram: полная декомпиляция и охота за ключами (apktool + jadx + нативные .so)"

# =============================================================================
#  Без сборки Android. Что делает:
#   1) качает официальный APK MDGram нужной версии (apkpure / apkcombo / trashbox);
#   2) подтверждает личность файла: пакет, версия, число dex, .so, sha256;
#   3) ПОЛНАЯ декомпиляция: apktool -> smali, jadx -> java (без ресурсов);
#   4) читает таблицы строк всех dex напрямую и достаёт все hex-32 кандидаты;
#   5) ищет api_id / api_hash в smali, java, dex, всех файлах APK и в нативных
#      библиотеках (с дампом чисел рядом со строкой-кандидатом);
#   6) проверяет найденные пары на живом сервере Telegram;
#   7) кладёт отчёт в notes/ и коммитит его.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия MDGram"
        default: "9.9.3"
        type: string
      skip_jadx:
        description: "Пропустить jadx (1 = только smali, быстрее)"
        default: "1"
        type: string
  push:
    paths:
      - '.github/workflows/mdgram-hunt.yml'
      - 'tools/hunt_mdgram.py'

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: "Забрать файлы мода"
        uses: actions/checkout@v4

      - name: "Инструменты: apktool (jar), aapt, jadx"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt unzip zip >/dev/null 2>&1 || true
          curl -sSL --retry 5 -o /opt/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar || \
            curl -sSL --retry 5 -o /opt/apktool.jar https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar || true
          ls -la /opt/apktool.jar || true
          if ! command -v jadx >/dev/null; then
            curl -sSL --retry 5 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip || true
            sudo mkdir -p /opt/jadx && sudo unzip -o -q /tmp/jadx.zip -d /opt/jadx || true
            sudo chmod +x /opt/jadx/bin/jadx 2>/dev/null || true
            sudo ln -sf /opt/jadx/bin/jadx /usr/local/bin/jadx || true
          fi
          java -version 2>&1 | head -2 || true
          jadx --version || true

      - name: "Скачать официальный APK MDGram"
        run: |
          set -euo pipefail
          mkdir -p /tmp/md notes
          VERSION="${{ inputs.version || '9.9.3' }}"
          python3 tools/fetch_mdgram.py "$VERSION" "/tmp/md/mdgram-$VERSION.apk" || true
          ls -la /tmp/md/ || true
          for f in /tmp/md/*.apk; do
            [ -s "$f" ] || continue
            echo "== $f  $(stat -c%s "$f") байт"
            echo "sha256: $(sha256sum "$f" | cut -c1-64)"
            aapt dump badging "$f" 2>/dev/null | head -6 || true
          done

      - name: "Полная декомпиляция и поиск ключей"
        continue-on-error: true
        run: |
          set +e
          APK=$(ls -S /tmp/md/*.apk 2>/dev/null | head -1)
          echo "APK: $APK"
          [ -n "$APK" ] || { echo "APK не скачался"; exit 0; }
          SKIP="${{ inputs.skip_jadx || '1' }}"
          if [ "$SKIP" = "1" ]; then
            python3 tools/hunt_mdgram.py --apk "$APK" --out notes/mdgram-hunt.txt --skip-jadx
          else
            python3 tools/hunt_mdgram.py --apk "$APK" --out notes/mdgram-hunt.txt
          fi
          tail -150 notes/mdgram-hunt.txt || true

      - name: "Проверить найденные пары на живом сервере Telegram"
        continue-on-error: true
        run: |
          set +e
          CAND=notes/mdgram-hunt-candidates.json
          if [ -s "$CAND" ]; then
            pip install --quiet telethon
            python3 tools/check_keys.py "$CAND" >> notes/mdgram-hunt.txt 2>&1 || true
          else
            echo "кандидатов нет — проверять нечего" >> notes/mdgram-hunt.txt
          fi
          tail -40 notes/mdgram-hunt.txt || true

      - name: "Закоммитить результат"
        if: always()
        run: |
          set -euo pipefail
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add notes/
          git commit -m "chore(mdgram): полная декомпиляция MDGram и охота за api_id/api_hash [skip ci]" || echo "нечего коммитить"
          git push || echo "не удалось запушить"
          echo "::notice title=MDGram hunt::$(grep -aE 'ПАКЕТ|hex-32|api_id=|api_hash=|ПРИНЯТ|ОТКЛОНЁН' notes/mdgram-hunt.txt 2>/dev/null | head -12 | tr '\n' ' ' | cut -c1-900)"
