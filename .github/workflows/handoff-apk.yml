name: Handoff APK (положить APK в папку handoff/)

# =============================================================================
#  Быстрый путь: берёт готовый APK из последней удачной сборки (Actions artifact)
#  и коммитит его в папку handoff/ этого репозитория, чтобы файл можно было
#  скачать обычной ссылкой прямо с GitHub, без похода в Actions.
#
#  Запускается автоматически при изменении этого файла, либо вручную
#  (Actions → Handoff APK → Run workflow), можно указать конкретный run_id.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID запуска сборки (пусто = последняя удачная сборка)"
        default: ""
        type: string
  push:
    branches: [ main, 'arena/**' ]
    paths:
      - '.github/workflows/handoff-apk.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: handoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  handoff:
    name: APK в handoff/
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Найти сборку и скачать APK
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-tgmod.yml/runs?status=success&per_page=1" \
                       --jq '.workflow_runs[0].id')
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "беру артефакт из запуска $RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '"версия: " + (.display_title // "-")'

          rm -rf dl && mkdir -p dl
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'tgmod-apk-*' --dir dl
          find dl -type f | head -10

      - name: Разложить по handoff/
        run: |
          set -euo pipefail
          mkdir -p handoff

          APK=$(find dl -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error title=Handoff::в артефакте нет APK"; exit 1; }

          BASE=$(basename "$APK")
          cp "$APK" "handoff/$BASE"
          cp "$APK" "handoff/KamiGram-latest.apk"
          find dl -name 'SHA256SUMS.txt' -exec cp {} handoff/ \; || true
          find dl -name 'MOD_INFO.txt'    -exec cp {} handoff/ \; || true

          # контрольная сумма для обеих копий
          ( cd handoff && sha256sum "$BASE" KamiGram-latest.apk > SHA256SUMS.txt )

          SIZE_MB=$(( $(wc -c < "handoff/$BASE") / 1048576 ))
          SHA=$(cut -d' ' -f1 handoff/SHA256SUMS.txt | head -1)
          echo "::notice title=Handoff::handoff/$BASE | ${SIZE_MB} МБ | sha256=$SHA"
          ls -lh handoff/

      - name: Закоммитить в репозиторий
        run: |
          set -uo pipefail
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -f handoff
          if git diff --cached --quiet; then
            echo "::notice title=Handoff::изменений нет — файл уже актуален"
            exit 0
          fi
          git commit -m "chore(handoff): APK в handoff/ (запуск $RUN_ID) [skip ci]"

          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "запушено"; exit 0; fi
            echo "пуш не прошёл (попытка $i) — подтягиваю изменения и пробую снова"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          echo "::error title=Handoff::не удалось запушить handoff/ за 3 попытки"
          exit 1
