name: "MDGram 9.9.3: полный декомпиль и ключи (без сборки APK)"

# =============================================================================
#  Без сборки Android:
#   1) скачивает APK MDGram (apkpure / apkcombo / trashbox / aptoide / archive.org);
#   2) ПОЛНОСТЬЮ декомпилирует его (jadx, все классы);
#   3) ищет api_id/api_hash в коде и в dex, включая неизвестные (свои) ключи мода;
#   4) проверяет найденные пары на живом сервере Telegram;
#   5) кладёт отчёт и декомпилированные классы с ключами в notes/ и коммитит.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия MDGram"
        default: "9.9.3"
        type: string
  push:
    paths:
      - '.github/workflows/mdgram-993.yml'

permissions:
  contents: write

jobs:
  mdgram:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: "Забрать файлы мода"
        uses: actions/checkout@v4

      - name: "Python 3.12 и jadx (релиз, если в apt нет)"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jadx || true
          if ! command -v jadx >/dev/null; then
            curl -sSL --retry 5 -o /tmp/jadx.zip \
              https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
            sudo mkdir -p /opt/jadx && sudo unzip -o -q /tmp/jadx.zip -d /opt/jadx
            sudo chmod +x /opt/jadx/bin/jadx
            sudo ln -sf /opt/jadx/bin/jadx /usr/local/bin/jadx
          fi
          jadx --version || true
          java -version 2>&1 | head -2

      - name: "Скачать APK MDGram"
        run: |
          set -euo pipefail
          mkdir -p notes /tmp/md
          VERSION="${{ inputs.version || '9.9.3' }}"
          echo "ищу MDGram $VERSION"
          python3 tools/fetch_mdgram.py "$VERSION" "/tmp/md/mdgram-$VERSION.apk" || true
          ls -la /tmp/md/ || true
          for f in /tmp/md/*.apk; do [ -s "$f" ] && echo "есть: $f"; done

      - name: "ПОЛНЫЙ декомпиль (jadx, все классы)"
        run: |
          set -euo pipefail
          found=0
          for apk in /tmp/md/*.apk; do
            [ -s "$apk" ] || continue
            found=1
            name=$(basename "$apk" .apk)
            python3 tools/full_decompile.py "$apk" "/tmp/jadx_$name" \
              "notes/mdgram-993-$name.txt" "/tmp/${name}-pairs.json" || true
          done
          if [ "$found" = "0" ]; then
            echo "APK MDGram не скачался — ни один источник не отдал файл" | tee notes/mdgram-993.txt
          fi
          ls -la notes/ || true

      - name: "Сохранить ключевые декомпилированные классы"
        run: |
          set -euo pipefail
          mkdir -p notes/mdgram-src
          for dir in /tmp/jadx_*; do
            [ -d "$dir" ] || continue
            find "$dir" -name 'BuildVars.java' -o -name 'BuildConfig.java' \
              -o -name 'ApplicationLoader.java' 2>/dev/null | head -10 | while read -r f; do
              cp "$f" "notes/mdgram-src/$(basename "$(dirname "$dir")")-$(basename "$f")" || true
            done
            grep -rl '014b35b6184100b085b0d0572f9b5103\|api_hash\|apiHash' "$dir" 2>/dev/null | head -10 | while read -r f; do
              cp "$f" "notes/mdgram-src/$(basename "$(dirname "$dir")")-api-$(basename "$f")" || true
            done
          done
          ls -la notes/mdgram-src/ | head -20
          du -sh notes/mdgram-src 2>/dev/null || true

      - name: "Проверить найденные пары на живом сервере"
        run: |
          set -euo pipefail
          pip install --quiet telethon
          cat /tmp/*-pairs.json 2>/dev/null | head -20 || true
          python3 tools/collect_pairs.py /tmp/*-pairs.json > /tmp/found.json 2>/dev/null || echo '{"pairs":[]}' > /tmp/found.json
          for f in notes/mdgram-993-*.txt; do
            [ -s "$f" ] || continue
            {
              echo
              echo "== проверка пар на живом сервере =="
              python3 tools/check_keys.py /tmp/found.json || true
            } >> "$f"
            tail -25 "$f"
          done

      - name: "Закоммитить результат"
        run: |
          set -euo pipefail
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add notes/
          git commit -m "chore(mdgram): полный декомпиль APK MDGram и проверка ключей [skip ci]" || echo "нечего коммитить"
          git push
