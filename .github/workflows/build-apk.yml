name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, arena/* ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install required SDK packages
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ls -la
          ls -la gradle/wrapper/

      - name: Build debug APK
        id: build
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon --info 2>&1 | tee build.log
          echo "=== BUILD FINISHED ==="
          ls -lhR app/build/ 2>&1 | head -n 200
          find app/build -type f -name "*.apk" 2>&1 | head -n 20
          echo "=== CHECK APK ==="
          ls -lh app/build/outputs/apk/debug/ 2>&1 || echo "No debug folder"
          du -h app/build/outputs/apk/debug/* 2>&1 || true
        continue-on-error: true

      - name: Show errors if failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "=== BUILD FAILED ==="
          cat build.log | tail -n 1500
          echo "=== ERRORS ==="
          grep -i -A5 "error\|FAILED" build.log | tail -n 1000 || true

      - name: Copy APK to handoff
        if: always()
        run: |
          mkdir -p handoff
          echo "Searching for APKs..."
          find . -type f -name "*.apk" | head -n 20
          echo "Copying..."
          find app/build -type f -name "*.apk" -exec cp -v {} handoff/ \; 2>&1 || true
          # Also try direct copy
          cp -v app/build/outputs/apk/debug/app-debug.apk handoff/app-debug.apk 2>&1 || true
          cp -v app/build/outputs/apk/debug/app-debug.apk handoff/lumi-aether-debug.apk 2>&1 || true
          # If still no apk, try to find any apk
          ls -lh handoff/ || true
          echo "=== HANDOFF CONTENTS ==="
          ls -lhR handoff/ || true
          # Create dummy info
          echo "Built at $(date) commit ${{ github.sha }}" > handoff/BUILD_INFO.txt
          echo "APK path: $(find handoff -name '*.apk' | head -n 1)" >> handoff/BUILD_INFO.txt
          cat handoff/BUILD_INFO.txt

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            handoff/
            app/build/outputs/
            build.log
          if-no-files-found: warn

      - name: Commit APK to handoff
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add handoff/ || true
          git status
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: add built APK to handoff/ [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
