name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, arena/* ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install required SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Copy APK to handoff
        run: |
          mkdir -p handoff
          ls -lh app/build/outputs/apk/debug/ || true
          cp app/build/outputs/apk/debug/app-debug.apk handoff/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk handoff/lumi-aether-debug.apk
          ls -lh handoff/
          echo "APK size: $(du -h handoff/app-debug.apk)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            handoff/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit APK to handoff folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add handoff/*.apk || true
          git add handoff/README.md || true
          # Also create a latest link file
          echo "APK built at $(date) from commit ${{ github.sha }}" > handoff/BUILD_INFO.txt
          git add handoff/BUILD_INFO.txt || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: add built APK to handoff/ [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
