name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, arena/* ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install required SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate release keystore for signed APK (update)
        run: |
          if [ ! -f app/release.keystore ]; then
            keytool -genkey -v -keystore app/release.keystore -alias aether -keyalg RSA -keysize 2048 -validity 10000 -storepass aether123 -keypass aether123 -dname "CN=Aether, OU=Dev, O=Aether, L=Aachen, S=NRW, C=DE" -noprompt
            echo "Keystore generated"
          fi
          ls -lh app/release.keystore

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build release APK (minified, signed, smaller)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
          echo "=== RELEASE BUILD SUCCESS ==="
          ls -lh app/build/outputs/apk/release/ || true
          find app/build -name "*.apk" -type f -ls || true

      - name: Build debug APK (minified)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee -a build.log
          echo "=== DEBUG BUILD SUCCESS ==="
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Copy APKs to handoff
        if: always()
        run: |
          mkdir -p handoff
          cp build.log handoff/build.log || true
          find app/build -name "*.apk" -type f -exec cp -v {} handoff/ \; || true
          ls -lh handoff/ || true
          # Standard names - prefer release
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk handoff/app-release.apk
            cp app/build/outputs/apk/release/app-release.apk handoff/lumi-aether-release.apk
            # Also keep as main for backward compat
            cp app/build/outputs/apk/release/app-release.apk handoff/app-debug.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk handoff/app-debug-min.apk || true
          fi
          # Create versioned release
          VERSION=$(grep versionName app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then VERSION="1.1.0"; fi
          echo "Version: $VERSION"
          if [ -f handoff/app-release.apk ]; then
            cp handoff/app-release.apk handoff/lumi-aether-v${VERSION}-release.apk || true
          fi
          echo "Built at $(date) commit $GITHUB_SHA version $VERSION" > handoff/BUILD_INFO.txt
          echo "=== APK sizes (minified with R8) ===" >> handoff/BUILD_INFO.txt
          ls -lh handoff/*.apk 2>&1 >> handoff/BUILD_INFO.txt || echo "No APK" >> handoff/BUILD_INFO.txt
          echo "" >> handoff/BUILD_INFO.txt
          echo "Providers: 33 models (19 original site + 6 OVH free anonymous + 4 Groq + 3 OpenRouter + 1 offline) — 32 online + offline fallback" >> handoff/BUILD_INFO.txt
          echo "Fixes: offline auto-routing (lumi-offline), Kilo/LLM7 anon without Bearer for :free models (issue #6317), Groq/OR disabled by default if no key, prioritized anon providers" >> handoff/BUILD_INFO.txt
          echo "Features: auto-routing with failover, intent classification offline, copy/share/regen, minimal lucide icons" >> handoff/BUILD_INFO.txt
          cat handoff/BUILD_INFO.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            handoff/
            app/build/outputs/
            build.log
          if-no-files-found: warn

      - name: Commit handoff
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add handoff/ app/release.keystore || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            VERSION=$(grep versionName app/build.gradle.kts | head -n1 | cut -d'"' -f2)
            git commit -m "ci: release APK v${VERSION} offline auto-routing + Kilo anon fix + 33 models [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
