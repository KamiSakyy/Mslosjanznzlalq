name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, arena/* ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install required SDK packages
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build debug APK
        id: build
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          echo "=== BUILD LOG TAIL ==="
          tail -n 500 build.log
          echo "=== LIST BUILD OUTPUTS ==="
          ls -lhR app/build/ 2>&1 | tail -n 300
          echo "=== FIND APK ==="
          find app/build -type f -name "*.apk" -ls 2>&1 || echo "No APK found via find"
          ls -lh app/build/outputs/apk/debug/ 2>&1 || echo "No debug folder"
        continue-on-error: true

      - name: Copy APK to handoff
        if: always()
        run: |
          mkdir -p handoff
          echo "=== COPY ATTEMPT ==="
          find app/build -type f -name "*.apk" -exec cp -v {} handoff/ \; 2>&1 || true
          cp -v app/build/outputs/apk/debug/*.apk handoff/ 2>&1 || true
          # Ensure we have at least one apk name
          if ls handoff/*.apk 1>/dev/null 2>&1; then
            cp -v handoff/*.apk handoff/app-debug.apk 2>&1 || true
            cp -v handoff/app-debug.apk handoff/lumi-aether-debug.apk 2>&1 || true
          fi
          ls -lh handoff/ || true
          echo "Built at $(date) commit ${{ github.sha }}" > handoff/BUILD_INFO.txt
          echo "Files in app/build:" >> handoff/BUILD_INFO.txt
          find app/build -type f | head -n 30 >> handoff/BUILD_INFO.txt 2>&1 || true
          cat handoff/BUILD_INFO.txt
          cp build.log handoff/build.log || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            handoff/
            app/build/outputs/
            build.log
          if-no-files-found: warn

      - name: Commit handoff
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add handoff/ || true
          git status
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "ci: update handoff with build outputs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
