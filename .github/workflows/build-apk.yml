name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, arena/* ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install required SDK packages
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build debug APK
        id: build
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          echo "=== TAIL ===" >> build.log
          tail -n 200 build.log >> build.log
          echo "=== LIST BUILD ===" >> build.log
          ls -lhR app/build/ 2>&1 | head -n 500 >> build.log
          echo "=== FIND APK ===" >> build.log
          find app -name "*.apk" -type f -ls 2>&1 >> build.log || echo "No APK" >> build.log
          cat build.log | tail -n 500

      - name: Copy APK to handoff
        if: always()
        run: |
          mkdir -p handoff
          cp build.log handoff/build.log || true
          find app/build -name "*.apk" -type f -exec cp -v {} handoff/ \; 2>&1 | tee -a handoff/build.log || true
          ls -lh handoff/ | tee -a handoff/build.log
          # Ensure standard names
          if [ -f handoff/app-debug.apk ]; then
            cp handoff/app-debug.apk handoff/lumi-aether-debug.apk || true
          else
            # Try to find any apk and copy to standard name
            APK=$(find handoff -name "*.apk" | head -n 1)
            if [ ! -z "$APK" ]; then
              cp "$APK" handoff/app-debug.apk
              cp "$APK" handoff/lumi-aether-debug.apk
            fi
          fi
          echo "Built at $(date) commit ${{ github.sha }}" > handoff/BUILD_INFO.txt
          echo "APK files:" >> handoff/BUILD_INFO.txt
          ls -lh handoff/*.apk 2>&1 >> handoff/BUILD_INFO.txt || echo "No APK in handoff" >> handoff/BUILD_INFO.txt
          cat handoff/BUILD_INFO.txt
          cat handoff/build.log | tail -n 200

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            handoff/
            app/build/outputs/
            build.log
          if-no-files-found: warn

      - name: Commit handoff
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add handoff/ || true
          git status
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "ci: update handoff with APK and logs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
