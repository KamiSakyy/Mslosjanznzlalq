name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, arena/* ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/cmdline-tools/
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install required SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ls -la gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon --info

      - name: Copy APK to handoff folder
        if: always()
        run: |
          mkdir -p handoff
          find app/build/outputs -name "*.apk" -type f | head -20
          cp app/build/outputs/apk/debug/*.apk handoff/app-debug.apk || true
          cp handoff/app-debug.apk handoff/lumi-aether-debug.apk || true
          ls -lh handoff/ || true
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            handoff/*.apk
          if-no-files-found: warn
