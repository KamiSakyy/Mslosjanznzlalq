name: Build TG Mod APK

# =============================================================================
#  Сборка мода Telegram (MslGram) из официальных исходников DrKLO/Telegram.
#
#  Ключевая идея (как у Nekogram/NekoX): НЕ нужны свои api_id / api_hash и
#  вообще никакие секреты — в исходниках Telegram уже вшиты официальные
#  APP_ID / APP_HASH, а подпись по умолчанию берётся из публичного
#  upstream-keystore (android / androidkey / android).
#
#  Запуск: Actions → Build TG Mod APK → Run workflow.
#  Сборка идёт ~40–70 минут (первый раз), дальше быстрее за счёт ccache/Gradle-кэша.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Название приложения (ярлык + UI)"
        default: "Sakura"
        type: string
      app_package:
        description: "applicationId (свой, чтобы ставилось рядом с Telegram)"
        default: "com.kami.gram"
        type: string
      version_suffix:
        description: "Суффикс версии (r106: пусто — без надписи mod)"
        default: ""
        type: string
      abis:
        description: "Какие ABI собирать (arm64-v8a — быстрее всего)"
        type: choice
        default: "arm64-v8a"
        options:
          - "arm64-v8a"
          - "arm64-v8a,armeabi-v7a"
      fail_fast:
        description: "Сначала отдельно проверить Java (дольше на ~5 мин; по умолчанию выключено)"
        default: "0"
        type: string
      tg_ref:
        description: "Ветка/коммит DrKLO/Telegram (r70: ЗАПИНЕН — база 12.10.3, на которой все P-патчи проверены)"
        default: "9552e5541e1274b9557c9832b204dbfcaf44b3dc"
        type: string
      disable_billing:
        description: "Выключить Google Play Billing (1/0)"
        default: "0"
        type: string
      max_economy:
        description: "Жёсткий power-saver: максимальная экономия, но БЕЗ анимаций (1/0)"
        default: "0"
        type: string
      no_stickers:
        description: "Не загружать стикеры и премиум-эмодзи по умолчанию (1/0, r101: по умолчанию 1 — это единственные заблокированные медиа вместе с историями)"
        default: "1"
        type: string
      autodownload_off:
        description: "Автоскачивание медиа выключено по умолчанию (1/0, r101: по умолчанию 0 — фото/видео/документы грузятся как в оригинале)"
        default: "0"
        type: string
      slim_heavy:
        description: "Урезать тяжёлые Lottie-анимации: 1 (крупные) | all (все) | 0 (не трогать)"
        default: "1"
        type: string
      res_configs:
        description: "Локали в APK (ru,en | all) — меньше = меньше APK"
        default: "ru,en"
        type: string
      build_lean:
        description: "Быстрая/лёгкая сборка: без debug-инфо в native, heap 5 ГБ (1/0)"
        default: "1"
        type: string
      create_release:
        description: "Создать GitHub Release с APK"
        default: true
        type: boolean
  push:
    branches: [ main, 'arena/**' ]
    paths:
      - 'mod/**'
      - '.github/workflows/build-tgmod.yml'

permissions:
  contents: write

# Один активный прогон: новый пуш отменяет предыдущий. Иначе две сборки
# одновременно дописывают архив в handoff, push одной отклоняется, и в
# handoff может остаться APK от старого коммита (так и вышло: в архиве
# лежала сборка #42, а Latest-релиз вышел #44).
concurrency:
  group: tgmod-kami-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка модифицированного APK
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      APP_NAME: ${{ inputs.app_name || 'Sakura' }}
      APP_PACKAGE: ${{ inputs.app_package || 'com.kami.gram' }}
      APP_VERSION_SUFFIX: ${{ inputs.version_suffix || '' }}
      ABIS: ${{ inputs.abis || 'arm64-v8a' }}
      TG_REF: ${{ inputs.tg_ref || '9552e5541e1274b9557c9832b204dbfcaf44b3dc' }}
      DISABLE_BILLING: ${{ inputs.disable_billing || '0' }}
      MAX_ECONOMY: ${{ inputs.max_economy || '0' }}
      NO_STICKERS: ${{ inputs.no_stickers || '1' }}
      AUTODOWNLOAD_OFF: ${{ inputs.autodownload_off || '0' }}
      SLIM_HEAVY: ${{ inputs.slim_heavy || '1' }}
      RES_CONFIGS: ${{ inputs.res_configs || 'ru,en' }}
      BUILD_LEAN: ${{ inputs.build_lean || '1' }}
      # ccache для нативной части (C/C++), живёт между запусками
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: true
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Освободить место на диске
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift \
                      /usr/local/.ghcup /opt/az /opt/microsoft /usr/local/share/chromium \
                      /usr/lib/firefox /usr/lib/mono /usr/local/lib/android/sdk/emulator \
                      /usr/local/lib/android/sdk/system-images \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL" 2>/dev/null || true
          df -h /
          free -h
          nproc

      - name: Забрать файлы мода (этот репозиторий)
        uses: actions/checkout@v7
        with:
          path: modrepo

      - name: Клонировать исходники Telegram (DrKLO/Telegram)
        uses: actions/checkout@v7
        with:
          repository: DrKLO/Telegram
          ref: ${{ inputs.tg_ref || '9552e5541e1274b9557c9832b204dbfcaf44b3dc' }}
          path: telegram-src
          fetch-depth: 1
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (platform 36, build-tools 36, NDK 27.2, cmake 3.22.1)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || { echo "::error::sdkmanager не найден в $SDK"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          packages=("platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1")
          installed=0
          for attempt in 1 2 3; do
            echo "Установка Android SDK, попытка $attempt/3"
            if "$SDKM" --install "${packages[@]}"; then
              installed=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::sdkmanager завершился с ошибкой; повтор через $((attempt * 15)) секунд"
              sleep $((attempt * 15))
            fi
          done
          [ "$installed" = 1 ] || { echo "::error::не удалось установить обязательные Android SDK packages"; exit 1; }
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Установить ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          ccache --version | head -1

      - name: Кэш ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ inputs.tg_ref || '9552e5541e1274b9557c9832b204dbfcaf44b3dc' }}-${{ inputs.abis || 'arm64-v8a' }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.tg_ref || '9552e5541e1274b9557c9832b204dbfcaf44b3dc' }}-${{ inputs.abis || 'arm64-v8a' }}-

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ImageMagick для Android-вариантов существующего artwork
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert --version | head -1
          identify --version | head -1

      - name: Свой ключ подписи (генерируется один раз и коммитится в repo)
        env:
          KS_ALIAS: kamigram
          KS_PASSWORD: kamigram2026
        run: |
          set -euo pipefail
          KS=modrepo/mod/keys/kamigram.jks
          if [ -f "$KS" ]; then
            echo "::notice title=Подпись::ключ уже в репозитории"
            exit 0
          fi
          echo "::notice title=Подпись::генерирую новый ключ Sakura (4096-bit RSA, JKS)"
          mkdir -p "$(dirname "$KS")"
          keytool -genkeypair -v \
            -keystore "$KS" -storetype JKS -alias "$KS_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$KS_PASSWORD" -keypass "$KS_PASSWORD" \
            -dname "CN=Sakura, OU=Mod, O=Sakura, L=Telegram Mod, ST=NRW, C=DE"
          base64 -w0 "$KS" > "$KS.b64"
          FP=$(keytool -list -v -keystore "$KS" -storepass "$KS_PASSWORD" 2>/dev/null | grep -m1 "SHA256:" | sed 's/.*SHA256: *//') || true
          echo "Отпечаток сертификата (SHA-256): ${FP:-не удалось получить}"
          echo "::notice title=Подпись Sakura::alias=$KS_ALIAS | пароль=$KS_PASSWORD | SHA-256 сертификата: ${FP:-н/д}"
          cd modrepo
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -f mod/keys/kamigram.jks mod/keys/kamigram.jks.b64
          git commit -m "chore(keys): собственный ключ подписи Sakura (alias=$KS_ALIAS) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Кастомный ключ подписи Sakura Line (второй APK, генерируется один раз)
        env:
          KS_ALIAS: sakura
          KS_PASSWORD: sakura2026line
        run: |
          set -euo pipefail
          KS=modrepo/mod/keys/sakura-line.jks
          if [ -f "$KS" ]; then
            echo "::notice title=Подпись Sakura Line::ключ уже в репозитории"
            exit 0
          fi
          echo "::notice title=Подпись Sakura Line::генерирую кастомный ключ (4096-bit RSA, JKS)"
          mkdir -p "$(dirname "$KS")"
          keytool -genkeypair -v \
            -keystore "$KS" -storetype JKS -alias "$KS_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$KS_PASSWORD" -keypass "$KS_PASSWORD" \
            -dname "CN=Sakura Line, OU=Sakura, O=Sakura, L=Frankfurt, ST=Hesse, C=DE"
          base64 -w0 "$KS" > "$KS.b64"
          FP=$(keytool -list -v -keystore "$KS" -storepass "$KS_PASSWORD" 2>/dev/null | grep -m1 "SHA256:" | sed 's/SHA256: *//') || true
          echo "::notice title=Подпись Sakura Line::alias=$KS_ALIAS | SHA-256 сертификата: ${FP:-н/д}"
          cd modrepo
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -f mod/keys/sakura-line.jks mod/keys/sakura-line.jks.b64
          git commit -m "chore(keys): кастомный ключ подписи Sakura Line (alias=$KS_ALIAS) [skip ci]"
          # За время сборки ветка могла уйти вперёд (например, [skip ci]-коммит
          # из песочницы) — синхронизируемся и проталкиваем ключ с ретраями.
          # Ключ ОБЯЗАН закрепиться в ветке, иначе каждая сборка подписывала
          # бы APK 2 другим одноразовым ключом.
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then pushed=1; break; fi
            echo "push отвергнут (ветка ушла вперёд), попытка $attempt — синхронизация"
            git fetch origin "${GITHUB_REF_NAME}" || true
            git rebase --strategy-option=theirs "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; sleep 5; }
          done
          if [ "$pushed" != "1" ]; then
            echo "::error title=Ключ Sakura Line не закреплён::push не удался после 3 попыток — сборка остановлена, чтобы APK 2 не подписывался одноразовым ключом"
            exit 1
          fi

      - name: Применить мод (брендинг, package id, свой ключ подписи)
        env:
          TG_DIR: ${{ github.workspace }}/telegram-src
        run: |
          set -euo pipefail
          # Подпись — оригинальный ключ Telegram (android / androidkey), как просил заказчик:
          # сборка быстрее, ключ не генерируется и не хранится. Своя подпись отключается.
          echo "::notice title=Подпись::оригинальный ключ Telegram (android / androidkey)"
          # Keep the patcher output in the workspace so a pre-Gradle failure is
          # diagnosable even when the Actions log-results URL expires.
          bash modrepo/mod/apply-mod.sh 2>&1 | tee apply.log

      # На push этот шаг выполняется всегда (inputs пустой): javac падает за
      # ~5 минут вместо 20+ минут полной сборки с NDK, и javac.log уходит в
      # диагностику. В workflow_dispatch по умолчанию выключен (fail_fast=0).
      - name: Быстрая проверка кода (javac до сборки APK)
        if: ${{ inputs.fail_fast != '0' }}
        working-directory: telegram-src
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain \
            :TMessagesProj:compileReleaseJavaWithJavac 2>&1 | tee ../javac.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ] && grep -qE "Task '.*' not found|Cannot locate tasks" ../javac.log; then
            echo "::warning title=build::fail-fast задача не найдена — идём в полную сборку без неё"
            exit 0
          fi
          exit "$code"

      - name: Сборка APK (assembleAfatRelease, arm64, экономия трафика)
        working-directory: telegram-src
        run: |
          set -o pipefail
          free -h || true
          ./gradlew --no-daemon --build-cache --stacktrace --console=plain \
            :TMessagesProj_App:assembleAfatRelease 2>&1 | tee ../build.log
          df -h / || true

      - name: Защита APK (диагностика R8 и dex-разбиения)
        working-directory: telegram-src
        run: |
          APK=$(find TMessagesProj_App/build/outputs/apk -name '*.apk' 2>/dev/null | head -1)
          echo "### APK: $APK"
          ls -la "$APK" 2>/dev/null || true
          echo "### Разбиение на dex (основной + мелкие)"
          unzip -l "$APK" 2>/dev/null | grep -E 'classes[0-9]*\.dex' || true
          echo "### R8 mapping — артефакт обфускации"
          ls -la TMessagesProj_App/build/outputs/mapping/afatRelease/ 2>/dev/null || true
          head -5 TMessagesProj_App/build/outputs/mapping/afatRelease/mapping.txt 2>/dev/null || true

      - name: Диагностика сборки (видно без доступа к логам)
        if: failure()
        run: |
          echo "### Свободное место"; df -h / || true
          echo "### Память"; free -h || true
          for f in apply.log javac.log build.log; do
            [ -f "$f" ] && { echo "### последние строки $f"; tail -n 25 "$f"; }
          done

          # Логи и артефакты Actions иногда не скачиваются (обрыв blob-хранилища),
          # поэтому всё важное дублируем в job summary и в аннотации Checks API.
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "## Диагностика сборки"
            echo
          } >> "$SUMMARY"

          found=0
          for f in apply.log javac.log build.log; do
            [ -f "$f" ] || continue
            found=1
            echo "### Аннотации из $f (Checks API)"

            # 1) Ошибки javac с двумя строками контекста (символ/место) — это
            #    то, что реально надо читать при «cannot find symbol».
            if grep -qE "error: |error; " "$f"; then
              {
                echo '### Ошибки компиляции Java'
                echo '```'
                grep -nE -A2 "error: |error; " "$f" | head -n 200 | tr -d '\r'
                echo '```'
                echo
              } >> "$SUMMARY"
              grep -nE "error: |error; " "$f" | grep -vE "C/C\+\+:|Multiple substitutions" \
                | head -n 30 | tr -d '\r' | while IFS= read -r line; do
                echo "::error title=javac ${f}::${line:0:900}"
              done
            fi

            # 2) Прочие сбои: патчер, Gradle, исключения.
            {
              echo "### Ключевые строки ${f}"
              echo '```'
              grep -nE "\[fail\]|Traceback|FAILURE:|What went wrong|Execution failed|Caused by|Task '.*' not found|Could not|Exception" "$f" \
                | head -n 60 | tr -d '\r'
              echo '```'
              echo
            } >> "$SUMMARY"
            grep -nE "\[fail\]|Traceback|FAILURE:|What went wrong|Execution failed|Caused by|Task '.*' not found|Could not|Exception" "$f" \
              | grep -vE "C/C\+\+:|Multiple substitutions" \
              | tail -n 15 | tr -d '\r' | while IFS= read -r line; do
              echo "::error title=Сбой ${f}::${line:0:900}"
            done
          done
          [ "$found" = "0" ] && echo "::error title=Сборка::ни apply.log, ни javac.log, ни build.log не найдены"
          exit 0

      - name: Загрузить лог сборки при падении
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.run_number }}
          path: |
            apply.log
            build.log
            javac.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Проверка и упаковка APK
        id: apk
        env:
          TG_DIR: ${{ github.workspace }}/telegram-src
        run: |
          set -uo pipefail   # без -e: косметические проверки не должны валить сборку

          APK=$(find telegram-src/TMessagesProj_App/build/outputs/apk -name '*.apk' 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "::error title=APK::файл не найден в build/outputs"; exit 1; fi
          echo "APK: $APK"

          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          AAPT2="${BT}aapt2"
          APKSIGNER="${BT}apksigner"
          echo "build-tools: ${BT:-не найдены}"

          "$AAPT2" dump badging "$APK" > /tmp/badging.txt 2>/tmp/badging.err || true
          echo "=== badging ==="
          grep -E "^package|application-label|sdkVersion|targetSdkVersion" /tmp/badging.txt | head -8 || true

          VERSION=$(grep -oP '^APP_VERSION_NAME=\K.*' telegram-src/gradle.properties || echo "")
          echo "ожидается: package=$APP_PACKAGE label=$APP_NAME version=$VERSION"

          # --- обязательные проверки (без них сборка не выпускается) ---
          FAILED=0
          grep -q "name='$APP_PACKAGE'" /tmp/badging.txt || { echo "::error title=Проверка::в APK неверный package id (ждали $APP_PACKAGE)"; FAILED=1; }
          grep -q "application-label:'$APP_NAME'" /tmp/badging.txt || { echo "::error title=Проверка::в APK неверное название приложения (ждали $APP_NAME)"; FAILED=1; }
          [ -n "$VERSION" ] && grep -q "versionName='$VERSION'" /tmp/badging.txt || { echo "::warning title=Проверка::версия в APK отличается от gradle.properties ($VERSION)"; }
          # Иконка Sakura: имена файлов в release-APK обфусцированы (res/Ab3.png),
          # поэтому проверяем не пути, а таблицу ресурсов aapt2: адаптивный
          # foreground из существующего Emilia artwork и круглый legacy launcher
          # обязаны присутствовать на всех плотностях.
          "$AAPT2" dump resources "$APK" > /tmp/resources.txt 2>/tmp/resources.err || true
          FG_CONFIGS=$(grep -A40 'mipmap/kamigram_icon_foreground' /tmp/resources.txt | grep -cE '\((default|mdpi|hdpi|xhdpi|xxhdpi|xxxhdpi)\)' || true)
          ROUND_CONFIGS=$(grep -A40 'mipmap/ic_launcher_round' /tmp/resources.txt | grep -cE '\((default|mdpi|hdpi|xhdpi|xxhdpi|xxxhdpi|anydpi-v26)\)' || true)
          BADGING_ICONS=$(grep -cE '^application-icon-' /tmp/badging.txt || true)
          echo "Emilia foreground configs: $FG_CONFIGS | ic_launcher_round configs: $ROUND_CONFIGS | badging icons: $BADGING_ICONS"
          ICON_LIST=$(grep -E 'mipmap/(ic_launcher|ic_launcher_round|kamigram_icon_foreground)' /tmp/resources.txt | tr '\n' ' ' || true)
          echo "::notice title=APK launcher resources::${ICON_LIST:0:900}"
          [ "$FG_CONFIGS" -ge 5 ] || { echo "::error title=Проверка::Emilia foreground иконки нет на всех плотностях (найдено $FG_CONFIGS)"; FAILED=1; }
          [ "$ROUND_CONFIGS" -ge 5 ] || { echo "::error title=Проверка::круглого launcher-ресурса ic_launcher_round нет на всех плотностях (найдено $ROUND_CONFIGS)"; FAILED=1; }
          [ "$BADGING_ICONS" -ge 1 ] || { echo "::error title=Проверка::aapt2 badging не видит application-icon — иконка не зарегистрирована"; FAILED=1; }
          [ "$FAILED" = "1" ] && exit 1

          # --- информационные проверки ---
          ABIS_IN_APK=$(unzip -l "$APK" 2>/dev/null | grep -oE 'lib/[^/]+/' | sort -u | tr -d ' /' | sed 's/^lib//' | tr '\n' ' ') || true
          echo "ABI внутри APK: ${ABIS_IN_APK:-не определены}"
          case "$ABIS_IN_APK" in *armeabi*|*x86*) echo "::warning title=Размер APK::внутри лишние ABI: $ABIS_IN_APK";; esac

          echo "=== подпись (apksigner verify) ==="
          "$APKSIGNER" verify --verbose "$APK" 2>&1 | head -15 || true
          echo "=== сертификат подписи ==="
          CERTS=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)
          echo "$CERTS" | head -10
          SIGNER=$(echo "$CERTS" | grep -m1 "certificate DN" | sed 's/^ *//') || true
          SIGNFP=$(echo "$CERTS" | grep -m1 "SHA-256 digest" | sed 's/^ *//') || true
          if [ -n "$SIGNER" ]; then
            echo "::notice title=Подпись APK::${SIGNER} | ${SIGNFP}"
          else
            echo "::warning title=Подпись APK::не удалось прочитать сертификат"
          fi

          ABIS_TAG="${ABIS//,/_}"
          OUT="$APP_NAME-$VERSION-$ABIS_TAG.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee SHA256SUMS.txt
          ls -lh "$OUT"

          {
            echo "version=$VERSION"
            echo "out=$OUT"
            echo "size=$(du -h "$OUT" | cut -f1)"
            echo "size_bytes=$(wc -c < "$OUT")"
            echo "sha=$(cut -d' ' -f1 SHA256SUMS.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Сборка APK 2 (пакет com.sakura.line, кастомная подпись Sakura Line)
        if: steps.apk.outputs.out != ''
        env:
          TG_DIR: ${{ github.workspace }}/telegram-src
          APP_PACKAGE: com.sakura.line
          KEYSTORE_PASSWORD: sakura2026line
          KEY_ALIAS: sakura
          KEY_PASSWORD: sakura2026line
        run: |
          set -euo pipefail
          echo "::notice title=APK 2::пакет com.sakura.line, кастомная подпись Sakura Line"
          # первый APK уже упакован и лежит в корне workspace — возвращаем
          # дерево к девственному состоянию и применяем мод заново
          cp telegram-src/mod-changes.patch /tmp/mod-changes-apk1.patch 2>/dev/null || true
          ( cd telegram-src && git checkout -f . && git clean -fdq )
          KEYSTORE_B64=$(base64 -w0 modrepo/mod/keys/sakura-line.jks)
          export KEYSTORE_B64
          bash modrepo/mod/apply-mod.sh
          cd telegram-src
          set +e
          ./gradlew --no-daemon --build-cache --stacktrace --console=plain \
            :TMessagesProj_App:assembleAfatRelease 2>&1 | tee ../build2.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            grep -nE "error:|FAILURE:|What went wrong|Execution failed|Caused by" ../build2.log | tail -n 8 | tr -d '\r' | while IFS= read -r line; do
              echo "::error title=Gradle build2.log::${line:0:900}"
            done
            exit "$code"
          fi

      - name: Проверка и упаковка APK 2
        if: steps.apk.outputs.out != ''
        id: apk2
        env:
          TG_DIR: ${{ github.workspace }}/telegram-src
        run: |
          set -uo pipefail
          APK=$(find telegram-src/TMessagesProj_App/build/outputs/apk -name '*.apk' 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "::error title=APK2::файл не найден в build/outputs"; exit 1; fi
          echo "APK2: $APK"

          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" > /tmp/badging2.txt 2>/dev/null || true
          VERSION=$(grep -oP '^APP_VERSION_NAME=\K.*' telegram-src/gradle.properties || echo "")

          FAILED=0
          grep -q "name='com.sakura.line'" /tmp/badging2.txt || { echo "::error title=APK2::неверный package id (ждали com.sakura.line)"; FAILED=1; }
          grep -q "application-label:'$APP_NAME'" /tmp/badging2.txt || { echo "::error title=APK2::неверное название приложения"; FAILED=1; }
          [ "$FAILED" = "1" ] && exit 1

          echo "=== подпись APK2 (apksigner) ==="
          CERTS=$("$BT/apksigner" verify --print-certs "$APK" 2>&1 || true)
          echo "$CERTS" | head -8
          SIGNER=$(echo "$CERTS" | grep -m1 "certificate DN" | sed 's/^ *//') || true
          echo "::notice title=Подпись APK2::${SIGNER:-не удалось прочитать сертификат}"
          case "$SIGNER" in *Sakura*) ;; *) echo "::warning title=Подпись APK2::ожидался кастомный сертификат Sakura Line";; esac

          OUT2="$APP_NAME-Line-$VERSION-${ABIS//,/_}.apk"
          cp "$APK" "$OUT2"
          sha256sum "$OUT2" >> SHA256SUMS.txt
          ls -lh "$OUT2"
          {
            echo "out2=$OUT2"
            echo "size2=$(du -h "$OUT2" | cut -f1)"
            echo "sha2=$(sha256sum "$OUT2" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Загрузить лог сборки 2 при падении
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build2-log-${{ github.run_number }}
          path: build2.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Архив в handoff/ (APK + исходники всех версий, ничего не удаляем)
        if: steps.apk.outputs.out != ''
        run: |
          set -uo pipefail
          APK="${{ steps.apk.outputs.out }}"
          VERSION="${{ steps.apk.outputs.version }}"
          RUN="${{ github.run_number }}"
          APK_DIR="modrepo/handoff/apk"
          SRC_DIR="modrepo/handoff/sources"
          NAME="Sakura-$VERSION-r$RUN.apk"
          echo "APK: $APK"
          ls -la "$APK" || { echo "::error title=Handoff::не найден файл APK ($APK)"; exit 1; }
          # копии держим ВНЕ репозитория: их не тронет синхронизация с origin ниже
          OUT=/tmp/handoff-out
          rm -rf "$OUT"; mkdir -p "$OUT/sources"
          cp "$APK" "$OUT/$NAME"
          cp "$APK" "$OUT/Sakura-latest.apk"
          APK2="${{ steps.apk2.outputs.out2 }}"
          if [ -n "$APK2" ] && [ -f "$APK2" ]; then
            cp "$APK2" "$OUT/SakuraLine-$VERSION-r$RUN.apk"
          fi
          cp telegram-src/MOD_INFO.txt "$OUT/sources/MOD_INFO-$VERSION-r$RUN.txt" 2>/dev/null || true

          if [ -d telegram-src/.git ]; then
            ( cd telegram-src && git add -A >/dev/null 2>&1; \
              git diff --cached --binary HEAD -- . ':(exclude)mod-changes.patch' > ../changes.patch 2>/dev/null ) || true
            if [ -s changes.patch ]; then
              gzip -9 -c changes.patch > "$OUT/sources/changes-$VERSION-r$RUN.patch.gz" || true
              grep -E '^ .* \| ' changes.patch > "$OUT/sources/changes-$VERSION-r$RUN.stat.txt" 2>/dev/null || true
            fi
          fi

          # ---- ИСХОДНИКИ НАШЕГО МОДА В .ZIP (просьба: сохранять всегда, не удалять) ----
          python3 modrepo/mod/zip-sources.py modrepo "$VERSION" "$RUN" telegram-src || true
          ls -la "$OUT/sources/" | tail -5 || true

          cd modrepo
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          # СНАЧАЛА синхронизируемся с веткой (без этого push падал: бинарные APK
          # конфликтовали при rebase, и архив не попадал в репозиторий).
          for i in 1 2 3; do
            if git fetch origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"; then
              echo "::notice title=Handoff::синхронизация с origin/${GITHUB_REF_NAME} — ок"
              break
            fi
            sleep 5
          done
          mkdir -p handoff/apk handoff/sources
          cp "$OUT"/*.apk handoff/apk/ || true
          cp "$OUT"/sources/* handoff/sources/ 2>/dev/null || true
          cp "$OUT/Sakura-latest.apk" handoff/Sakura-latest.apk 2>/dev/null || true
          cd ..

          ( cd "$APK_DIR" && sha256sum *.apk | sort -k2 ) > modrepo/handoff/SHA256SUMS.txt || true
          {
            echo '# Sakura - архив сборок'
            echo
            echo 'Все версии APK и исходников сохраняются навсегда, ничего не удаляется.'
            echo
            echo '## Версии APK'
            echo
            echo '| файл | размер | sha256 |'
            echo '|---|---|---|'
            for f in "$APK_DIR"/*.apk; do
              [ -f "$f" ] || continue
              BN=$(basename "$f")
              [ "$BN" = "Sakura-latest.apk" ] && continue
              echo "| \`apk/$BN\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-16)...\` |"
            done
            echo
            echo '## Исходники версий'
            echo
            echo 'Каждая запись = MOD_INFO (версия, коммит Telegram, патчи) + changes-*.patch.gz (полный diff).'
            echo 'Восстановление: клонировать DrKLO/Telegram на коммит из MOD_INFO, затем gunzip -c changes-*.patch.gz | git apply.'
            echo
            echo '| файл | размер |'
            echo '|---|---|'
            for f in "$SRC_DIR"/*; do
              [ -f "$f" ] || continue
              echo "| \`sources/$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "Обновлено: $(date -u '+%Y-%m-%d %H:%M') UTC"
          } > modrepo/handoff/INDEX.md
          ls -lh modrepo/handoff/apk | tail -5

          cd modrepo
          git add -f handoff
          if git diff --cached --quiet; then
            echo "::notice title=Handoff::архив уже актуален"
            exit 0
          fi
          git commit -m "chore(handoff): архив $VERSION (сборка #$RUN) [skip ci]" || true
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "::notice title=Handoff::архив обновлён — handoff/apk/$NAME"
              exit 0
            fi
            git fetch origin "${GITHUB_REF_NAME}" || true
            git rebase --strategy-option=theirs "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; sleep 5; }
          done
          echo "::warning title=Handoff::push архива не удался (APK есть в артефактах и релизе)"

      - name: Итоги в summary
        if: always()
        run: |
          {
            echo "## $APP_NAME — сборка мода Telegram"
            echo
            echo "| параметр | значение |"
            echo "|---|---|"
            echo "| package id | \`$APP_PACKAGE\` |"
            echo "| версия | \`${{ steps.apk.outputs.version || '—' }}\` |"
            echo "| ABI | \`$ABIS\` |"
            echo "| MAX ECONOMY | \`$MAX_ECONOMY\` (1 = жёсткая экономия без анимаций, 0 = анимации включены) |"
            echo "| стикеры/премиум-эмодзи | \`$NO_STICKERS\` (1 = не загружаются вообще) |"
            echo "| автоскачивание медиа | \`$AUTODOWNLOAD_OFF\` (1 = выключено по умолчанию) |"
            echo "| локали | \`$RES_CONFIGS\` |"
            echo "| урезание анимаций | \`$SLIM_HEAVY\` |"
            echo "| APK | \`${{ steps.apk.outputs.out || '—' }}\` (${{ steps.apk.outputs.size || '—' }}) — package \`$APP_PACKAGE\`, текущая подпись |"
            echo "| SHA-256 | \`${{ steps.apk.outputs.sha || '—' }}\` |"
            echo "| APK 2 | \`${{ steps.apk2.outputs.out2 || '—' }}\` (${{ steps.apk2.outputs.size2 || '—' }}) — package \`com.sakura.line\`, кастомная подпись Sakura Line |"
            echo "| SHA-256 (APK 2) | \`${{ steps.apk2.outputs.sha2 || '—' }}\` |"
            echo "| исходники | DrKLO/Telegram @ \`$TG_REF\` |"
            echo
            echo "Ключ Telegram: в сборку вшит рабочий api_id (сервер отклоняет только примерный api_id = 4 с ошибкой API_ID_PUBLISHED_FLOOD)."
          } >> "$GITHUB_STEP_SUMMARY"
          [ -f telegram-src/MOD_INFO.txt ] && cat telegram-src/MOD_INFO.txt || true

      - name: Аннотация с итогом сборки (видно даже без логов)
        if: always()
        run: |
          echo "::notice title=$APP_NAME ${{ steps.apk.outputs.version }}::package=$APP_PACKAGE | ABI=$ABIS | apk=${{ steps.apk.outputs.out }} | size=${{ steps.apk.outputs.size }} | sha256=${{ steps.apk.outputs.sha }} | apk2=${{ steps.apk2.outputs.out2 }} (com.sakura.line, кастомная подпись) | size2=${{ steps.apk2.outputs.size2 }} | sha256_2=${{ steps.apk2.outputs.sha2 }} | locales=$RES_CONFIGS | maxEconomy=$MAX_ECONOMY | noStickers=$NO_STICKERS | autodownloadOff=$AUTODOWNLOAD_OFF | slimHeavy=$SLIM_HEAVY"

      - name: Загрузить APK как artifact
        uses: actions/upload-artifact@v7
        with:
          name: tgmod-apk-${{ steps.apk.outputs.version }}-${{ github.run_number }}
          path: |
            ${{ steps.apk.outputs.out }}
            ${{ steps.apk2.outputs.out2 }}
            SHA256SUMS.txt
            telegram-src/MOD_INFO.txt
          retention-days: 30
          if-no-files-found: error

      - name: Загрузить patch-дифф изменений
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tgmod-diff-${{ github.run_number }}
          path: telegram-src/mod-changes.patch
          if-no-files-found: ignore
          retention-days: 30

      - name: GitHub Release
        if: steps.apk.outputs.out != '' && (github.event_name != 'workflow_dispatch' || inputs.create_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          APK="${{ steps.apk.outputs.out }}"
          APK2="${{ steps.apk2.outputs.out2 }}"
          FILES=("$APK" SHA256SUMS.txt)
          if [ -n "$APK2" ] && [ -f "$APK2" ]; then FILES+=("$APK2"); fi
          TAG="mod-${{ steps.apk.outputs.version }}-r${{ github.run_number }}"
          TITLE="$APP_NAME ${{ steps.apk.outputs.version }} (мод Telegram)"
          NOTES="Модифицированная сборка Telegram из исходников DrKLO/Telegram.
          Свои api_id/api_hash не требуются — используются официальные встроенные.
          APK 1: package $APP_PACKAGE (текущая подпись). APK 2: package com.sakura.line (кастомная подпись Sakura Line). ABI: $ABIS, upstream: $TG_REF"

          echo "файлы: $(ls -la "${FILES[@]}" 2>&1 | tr '\n' ' ')"
          echo "gh: $(gh --version 2>&1 | head -1)"

          create_release() {
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$TITLE" --notes "$NOTES" --latest "${FILES[@]}"
            fi
          }

          if create_release > /tmp/release.log 2>&1; then
            URL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
            echo "::notice title=Release::$URL"
            cat /tmp/release.log
          else
            echo "=== первая попытка не удалась, повтор без --latest ==="
            tail -n 10 /tmp/release.log | while IFS= read -r line; do echo "::warning title=Release::${line:0:400}"; done
            if gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TITLE" --notes "$NOTES" "${FILES[@]}" > /tmp/release2.log 2>&1; then
              cat /tmp/release2.log
            else
              tail -n 10 /tmp/release2.log | while IFS= read -r line; do echo "::error title=Release::${line:0:400}"; done
              echo "::warning title=Release::релиз не создан — APK доступен в артефактах запуска"
            fi
          fi
