name: "MDGram keys + проверка ключей Telegram (без сборки APK)"

# =============================================================================
#  Разовый анализ, без сборки Android:
#   1) качает APK MDGram и вытаскивает его api_id/api_hash;
#   2) проверяет НА ЖИВОМ СЕРВЕРЕ TELEGRAM, какие ключи принимаются сейчас
#      (заведомо неверный номер: принятый ключ даёт ответ по номеру,
#      отклонённый — API_ID_PUBLISHED_FLOOD) и пишет результат в notes/.
# =============================================================================

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mdgram-keys.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Забрать файлы мода"
        uses: actions/checkout@v4

      - name: "Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "Скачать и разобрать APK MDGram"
        run: |
          set -euo pipefail
          mkdir -p notes
          url="https://github.com/jair1c/MDGram/releases/download/V5/MDGram-arm64.apk"
          for i in 1 2 3 4 5; do
            curl -sSL --retry 5 --retry-all-errors --max-time 600 -o /tmp/mdgram.apk "$url" && break
            sleep 5
          done
          ls -la /tmp/mdgram.apk
          mkdir -p /tmp/md && unzip -o -q /tmp/mdgram.apk -d /tmp/md
          python3 tools/scan_dex.py /tmp/md > notes/mdgram-keys.txt 2>&1 || true
          cat notes/mdgram-keys.txt

      - name: "Проверить ключи на живом сервере Telegram"
        run: |
          set -euo pipefail
          pip install --quiet telethon
          python3 tools/check_keys.py >> notes/mdgram-keys.txt 2>&1 || true
          tail -25 notes/mdgram-keys.txt

      - name: "Закоммитить результат в ветку"
        run: |
          set -euo pipefail
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add notes/mdgram-keys.txt
          git commit -m "chore(mdgram): разбор APK MDGram + проверка ключей на живом сервере [skip ci]" || echo "нечего коммитить"
          git push
