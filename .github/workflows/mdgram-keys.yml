name: "MDGram keys (разовый разбор APK, без сборки)"

# =============================================================================
#  Разово: скачивает APK MDGram из релиза и вытаскивает строки-кандидаты
#  api_hash (32 hex) + api_id из его classes*.dex. Результат кладёт в notes/
#  и коммитит в текущую ветку. Никакой сборки Android здесь нет.
# =============================================================================

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mdgram-keys.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Забрать файлы мода"
        uses: actions/checkout@v4

      - name: "Скачать APK MDGram (arm64)"
        run: |
          set -euo pipefail
          url="https://github.com/jair1c/MDGram/releases/download/V5/MDGram-arm64.apk"
          for i in 1 2 3 4 5; do
            curl -sSL --retry 5 --retry-all-errors --max-time 600 -o /tmp/mdgram.apk "$url" && break
            echo "попытка $i не удалась"
            sleep 5
          done
          ls -la /tmp/mdgram.apk
          file /tmp/mdgram.apk

      - name: "Разобрать dex — кандидаты api_hash и api_id"
        run: |
          set -euo pipefail
          mkdir -p /tmp/md
          unzip -o -q /tmp/mdgram.apk -d /tmp/md
          ls /tmp/md/classes*.dex || true
          mkdir -p notes
          {
            echo "MDGram APK: $(sha256sum /tmp/mdgram.apk | cut -c1-64)"
            echo "размер: $(stat -c%s /tmp/mdgram.apk)"
            echo
            echo "== известные ключи (проверка, что строки вообще видны) =="
            for k in 014b35b6184100b085b0d0572f9b5103 b18441a1ff607e10a989891a5462e627 eb06d4abfb49dc3eeb1aeb98ae0f581e 1c5c96d5edd401b1ed40db3fb5633e2d 3e0cb5efcd52300aec5994fdfc5bdc16 a3406de8d171bb422bb6ddf3bbd800e2; do
              n=$(strings -a /tmp/md/classes*.dex | grep -c "$k" || true)
              echo "$k -> $n"
            done
            echo
            echo "== все hex-32 строки из dex (кандидаты api_hash), первые 400 =="
            strings -a /tmp/md/classes*.dex | grep -E '^[0-9a-f]{32}$' | sort | uniq -c | sort -rn | head -400
            echo
            echo "== вхождения 'mdgram' и рядом =="
            strings -a /tmp/md/classes*.dex | grep -i -E 'mdgram' | sort -u | head -60
            echo
            echo "== версия/пакет =="
            strings -a /tmp/md/AndroidManifest.xml | head -20
            aapt2 dump badging /tmp/mdgram.apk 2>/dev/null | head -5 || true
          } > notes/mdgram-keys.txt 2>&1 || true
          wc -l notes/mdgram-keys.txt
          head -60 notes/mdgram-keys.txt

      - name: "Закоммитить результат в ветку"
        run: |
          set -euo pipefail
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add notes/mdgram-keys.txt
          git commit -m "chore(mdgram): разбор APK MDGram — кандидаты api_hash/api_id [skip ci]" || echo "нечего коммитить"
          git push
